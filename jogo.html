<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PokéCare - Meu Pokémon</title>

       <link rel="stylesheet" href="jogo.css">
</head>

<body>

    <main class="jogo">

        <!-- ========================================== -->
        <!-- NOME DO POKÉMON -->
        <!-- ========================================== -->

        <h1>PokéCare</h1>

        <h2 id="nomePokemon">Meu Pokémon</h2>


        <!-- ========================================== -->
        <!-- IMAGEM DO POKÉMON -->
        <!-- ========================================== -->

        <div class="pokemon-container">

            <img
                id="imagemPokemon"
                src=""
                alt="Pokémon"
            >

        </div>


        <!-- ========================================== -->
        <!-- STATUS -->
        <!-- ========================================== -->

        <section class="status">

            <!-- VIDA -->
            <div class="status-item">

                <span>❤️ Vida:</span>

                <span id="valorVida">100</span>

                <div class="barra">
                    <div id="barraVida" class="barra-preenchimento"></div>
                </div>

            </div>


            <!-- FOME -->
            <div class="status-item">

                <span>🍖 Fome:</span>

                <span id="valorFome">50</span>

                <div class="barra">
                    <div id="barraFome" class="barra-preenchimento"></div>
                </div>

            </div>


            <!-- HUMOR -->
            <div class="status-item">

                <span>😊 Humor:</span>

                <span id="valorHumor">50</span>

                <div class="barra">
                    <div id="barraHumor" class="barra-preenchimento"></div>
                </div>

            </div>


            <!-- ENERGIA -->
            <div class="status-item">

                <span>⚡ Energia:</span>

                <span id="valorEnergia">100</span>

                <div class="barra">
                    <div id="barraEnergia" class="barra-preenchimento"></div>
                </div>

            </div>


            <!-- SONO -->
            <div class="status-item">

                <span>💤 Sono:</span>

                <span id="valorSono">0</span>

                <div class="barra">
                    <div id="barraSono" class="barra-preenchimento"></div>
                </div>

            </div>

        </section>


        <!-- ========================================== -->
        <!-- NÍVEL E XP -->
        <!-- ========================================== -->

        <section class="experiencia">

            <h3>
                ⭐ Nível <span id="nivel">1</span>
            </h3>

            <p>
                XP: <span id="experiencia">0</span> / 100
            </p>

            <div class="barra">
                <div id="barraXP" class="barra-preenchimento"></div>
            </div>

        </section>


        <!-- ========================================== -->
        <!-- MENSAGEM -->
        <!-- ========================================== -->

        <div id="mensagem" class="mensagem">
            Olá! Cuide bem do seu Pokémon! ❤️
        </div>


        <!-- ========================================== -->
        <!-- BOTÕES -->
        <!-- ========================================== -->

        <section class="acoes">

            <button onclick="alimentar()">
                🍖 Alimentar
            </button>

            <button onclick="brincar()">
                🎾 Brincar
            </button>

            <button onclick="dormir()">
                💤 Dormir
            </button>

            <button onclick="carinho()">
                ❤️ Carinho
            </button>

            <button onclick="banho()">
                🚿 Banho
            </button>

        </section>


        <!-- ========================================== -->
        <!-- VOLTAR -->
        <!-- ========================================== -->

        <button onclick="voltarEscolha()">
            ⬅️ Escolher outro Pokémon
        </button>

    </main>


    <!-- ========================================== -->
    <!-- JAVASCRIPT -->
    <!-- ========================================== -->

    <script src="script.js"></script>

</body>

</html>
