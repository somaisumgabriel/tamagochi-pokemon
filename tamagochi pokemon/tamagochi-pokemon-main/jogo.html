<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Tamagotchi Pokémon</title>

    <link rel="stylesheet" href="jogo.css">

</head>

<body>

    <div class="tamagotchi">

        <!-- TÍTULO -->

        <header class="topo">

            <h1>⚡ TAMAGOTCHI POKÉMON ⚡</h1>

            <p id="nomePokemon">
                Pikachu
            </p>

        </header>


        <!-- ÁREA DO POKÉMON -->

        <section class="area-pokemon">

            <img
                id="imagemPokemon"
                src=""
                alt="Seu Pokémon"
            >

        </section>


        <!-- STATUS -->

        <section class="status">

            <div class="status-item">

                <div class="status-nome">
                    ❤️ Vida
                </div>

                <div class="barra">
                    <div
                        id="barraVida"
                        class="barra-preenchida"
                    ></div>
                </div>

                <span id="valorVida">
                    100
                </span>

            </div>


            <div class="status-item">

                <div class="status-nome">
                    🍖 Fome
                </div>

                <div class="barra">
                    <div
                        id="barraFome"
                        class="barra-preenchida barra-fome"
                    ></div>
                </div>

                <span id="valorFome">
                    50
                </span>

            </div>


            <div class="status-item">

                <div class="status-nome">
                    😊 Humor
                </div>

                <div class="barra">
                    <div
                        id="barraHumor"
                        class="barra-preenchida barra-humor"
                    ></div>
                </div>

                <span id="valorHumor">
                    50
                </span>

            </div>


            <div class="status-item">

                <div class="status-nome">
                    ⚡ Energia
                </div>

                <div class="barra">
                    <div
                        id="barraEnergia"
                        class="barra-preenchida barra-energia"
                    ></div>
                </div>

                <span id="valorEnergia">
                    100
                </span>

            </div>


            <div class="status-item">

                <div class="status-nome">
                    💤 Sono
                </div>

                <div class="barra">
                    <div
                        id="barraSono"
                        class="barra-preenchida barra-sono"
                    ></div>
                </div>

                <span id="valorSono">
                    0
                </span>

            </div>

        </section>


        <!-- EXPERIÊNCIA -->

        <section class="experiencia">

            <div class="nivel">
                ⭐ Nível
                <span id="nivel">1</span>
            </div>

            <div class="xp-texto">
                XP: <span id="experiencia">0</span>/100
            </div>

            <div class="barra xp">
                <div
                    id="barraXP"
                    class="barra-preenchida"
                ></div>
            </div>

        </section>


        <!-- BOTÕES -->

        <section class="acoes">

            <button onclick="alimentar()" class="acao">
                <span>🍖</span>
                <small>Alimentar</small>
            </button>

            <button onclick="brincar()" class="acao">
                <span>🎾</span>
                <small>Brincar</small>
            </button>

            <button onclick="dormir()" class="acao">
                <span>💤</span>
                <small>Dormir</small>
            </button>

            <button onclick="carinho()" class="acao">
                <span>❤️</span>
                <small>Carinho</small>
            </button>

            <button onclick="banho()" class="acao">
                <span>🚿</span>
                <small>Banho</small>
            </button>

        </section>


        <!-- MENSAGEM -->

        <div id="mensagem" class="mensagem">
            Seu Pokémon está esperando por você! ❤️
        </div>


        <!-- VOLTAR -->

        <button onclick="voltarEscolha()" class="voltar">
            ← Trocar Pokémon
        </button>

    </div>


    <script src="jogo.js"></script>

</body>

</html>
